trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**
      - src/**
      - tests/**
      - pipelines/infrastructure-cd.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: '1.16.1'
  PYTHON_VERSION: '3.12'

  AZURE_SERVICE_CONNECTION: 'eipp-azure-wif'

  FUNCTION_SOURCE: 'src/invoice_processor'
  FUNCTION_PACKAGE: 'eipp-function.zip'

  DEV_ROOT: 'infrastructure/environments/dev'
  DEV_PLAN: 'eipp-dev.tfplan'
  DEV_FUNCTION_APP: 'func-eipp-dev-cus-2978a89b'
  DEV_RESOURCE_GROUP: 'rg-eipp-dev-app-cus'

  PROD_ROOT: 'infrastructure/environments/prod'
  PROD_PLAN: 'eipp-prod.tfplan'
  PROD_FUNCTION_APP: 'func-eipp-prod-cus-2978a89b'
  PROD_RESOURCE_GROUP: 'rg-eipp-prod-app-cus'


stages:

# ============================================================
# VALIDATE
# ============================================================

- stage: Validate
  displayName: Validate Application and Terraform

  jobs:

    - job: Validation
      displayName: Validate application and infrastructure

      steps:

        - checkout: self
          clean: true

        - task: UsePythonVersion@0
          displayName: Use Python $(PYTHON_VERSION)
          inputs:
            versionSpec: '$(PYTHON_VERSION)'
            addToPath: true

        - bash: |
            set -euo pipefail

            python --version
            python -m pip install --upgrade pip

            python -m pip install \
              -r "$(Build.SourcesDirectory)/$(FUNCTION_SOURCE)/requirements.txt"

            python -m pip install pytest

            python -m pytest \
              "$(Build.SourcesDirectory)/tests" \
              -v

            python -m compileall \
              "$(Build.SourcesDirectory)/$(FUNCTION_SOURCE)"
          displayName: Validate Function application

        - bash: |
            set -euo pipefail

            sudo apt-get update -qq
            sudo apt-get install -y unzip

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"

            unzip -q terraform.zip
            sudo install terraform /usr/local/bin/terraform

            terraform version
          displayName: Install Terraform

        - bash: |
            set -euo pipefail

            terraform fmt -check -recursive \
              "$(Build.SourcesDirectory)/infrastructure"
          displayName: Terraform format check

        - bash: |
            set -euo pipefail

            for ROOT in \
              "$(Build.SourcesDirectory)/$(DEV_ROOT)" \
              "$(Build.SourcesDirectory)/$(PROD_ROOT)"
            do
              echo "=========================================="
              echo "Validating $ROOT"
              echo "=========================================="

              terraform -chdir="$ROOT" init \
                -backend=false \
                -input=false

              terraform -chdir="$ROOT" validate
            done
          displayName: Terraform validate


# ============================================================
# BUILD FUNCTION ONCE
# ============================================================

- stage: BuildFunction
  displayName: Build Azure Function Package

  dependsOn: Validate
  condition: succeeded()

  jobs:

    - job: PackageFunction
      displayName: Package Azure Function

      steps:

        - checkout: self
          clean: true

        - task: UsePythonVersion@0
          displayName: Use Python $(PYTHON_VERSION)
          inputs:
            versionSpec: '$(PYTHON_VERSION)'
            addToPath: true

        - bash: |
            set -euo pipefail

            sudo apt-get update -qq
            sudo apt-get install -y zip unzip

            PACKAGE_ROOT="$(Build.ArtifactStagingDirectory)/function"

            mkdir -p "$PACKAGE_ROOT"

            cp -R \
              "$(Build.SourcesDirectory)/$(FUNCTION_SOURCE)/." \
              "$PACKAGE_ROOT/"

            python -m pip install --upgrade pip

            python -m pip install \
              --target "$PACKAGE_ROOT/.python_packages/lib/site-packages" \
              -r "$PACKAGE_ROOT/requirements.txt"

            test -f "$PACKAGE_ROOT/host.json"
            test -f "$PACKAGE_ROOT/function_app.py"
            test -f "$PACKAGE_ROOT/processor.py"

            cd "$PACKAGE_ROOT"

            zip -qr \
              "$(Build.ArtifactStagingDirectory)/$(FUNCTION_PACKAGE)" \
              .

            echo "=========================================="
            echo "Function package validation"
            echo "=========================================="

            unzip -l \
              "$(Build.ArtifactStagingDirectory)/$(FUNCTION_PACKAGE)" \
              | head -80
          displayName: Build Function deployment package

        - publish: $(Build.ArtifactStagingDirectory)/$(FUNCTION_PACKAGE)
          artifact: function-package
          displayName: Publish Azure Function package


# ============================================================
# DEV PLAN
# ============================================================

- stage: DevPlan
  displayName: DEV Terraform Plan

  dependsOn:
    - Validate
    - BuildFunction

  condition: and(
    succeeded('Validate'),
    succeeded('BuildFunction')
    )

  jobs:

    - job: TerraformPlan
      displayName: Plan DEV infrastructure

      steps:

        - checkout: self
          clean: true

        - bash: |
            set -euo pipefail

            sudo apt-get update -qq
            sudo apt-get install -y unzip

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"

            unzip -q terraform.zip
            sudo install terraform /usr/local/bin/terraform
          displayName: Install Terraform

        - task: AzureCLI@2
          displayName: Terraform init and plan DEV using WIF

          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            addSpnToEnvironment: true

            inlineScript: |
              set -euo pipefail

              export ARM_USE_OIDC=true
              export ARM_USE_AZUREAD=true
              export ARM_CLIENT_ID="$servicePrincipalId"
              export ARM_TENANT_ID="$tenantId"
              export ARM_OIDC_TOKEN="$idToken"
              export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

              DEV_PATH="$(Build.SourcesDirectory)/$(DEV_ROOT)"

              terraform -chdir="$DEV_PATH" init \
                -reconfigure \
                -input=false \
                -backend-config=backend.hcl

              terraform -chdir="$DEV_PATH" plan \
                -input=false \
                -out="$(DEV_PLAN)"

              terraform -chdir="$DEV_PATH" show \
                -no-color \
                "$(DEV_PLAN)" \
                > "$(Build.ArtifactStagingDirectory)/eipp-dev-plan.txt"

              cp \
                "$DEV_PATH/$(DEV_PLAN)" \
                "$(Build.ArtifactStagingDirectory)/$(DEV_PLAN)"

        - publish: $(Build.ArtifactStagingDirectory)
          artifact: dev-terraform-plan
          displayName: Publish DEV Terraform plan


# ============================================================
# DEV DEPLOY
# ============================================================

- stage: DevDeploy
  displayName: Deploy DEV

  dependsOn: DevPlan
  condition: succeeded()

  jobs:

    - deployment: ApplyDev
      displayName: Apply DEV Terraform and Function

      environment: eipp-dev

      strategy:
        runOnce:
          deploy:

            steps:

              - checkout: self
                clean: true

              - download: current
                artifact: dev-terraform-plan

              - download: current
                artifact: function-package

              - bash: |
                  set -euo pipefail

                  sudo apt-get update -qq
                  sudo apt-get install -y unzip

                  curl -fsSLo terraform.zip \
                    "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"

                  unzip -q terraform.zip
                  sudo install terraform /usr/local/bin/terraform
                displayName: Install Terraform

              - task: AzureCLI@2
                displayName: Terraform apply DEV

                inputs:
                  azureSubscription: $(AZURE_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true

                  inlineScript: |
                    set -euo pipefail

                    export ARM_USE_OIDC=true
                    export ARM_USE_AZUREAD=true
                    export ARM_CLIENT_ID="$servicePrincipalId"
                    export ARM_TENANT_ID="$tenantId"
                    export ARM_OIDC_TOKEN="$idToken"
                    export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                    DEV_PATH="$(Build.SourcesDirectory)/$(DEV_ROOT)"

                    terraform -chdir="$DEV_PATH" init \
                      -reconfigure \
                      -input=false \
                      -backend-config=backend.hcl

                    cp \
                      "$(Pipeline.Workspace)/dev-terraform-plan/$(DEV_PLAN)" \
                      "$DEV_PATH/$(DEV_PLAN)"

                    terraform -chdir="$DEV_PATH" apply \
                      -input=false \
                      -auto-approve \
                      "$(DEV_PLAN)"

              - task: AzureCLI@2
                displayName: Deploy Azure Function to DEV

                inputs:
                  azureSubscription: $(AZURE_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript

                  inlineScript: |
                    set -euo pipefail

                    FUNCTION_ZIP="$(Pipeline.Workspace)/function-package/$(FUNCTION_PACKAGE)"

                    test -f "$FUNCTION_ZIP"

                    az functionapp show \
                      --name "$(DEV_FUNCTION_APP)" \
                      --resource-group "$(DEV_RESOURCE_GROUP)" \
                      --query "{Name:name,State:state}" \
                      -o table

                    az functionapp deployment source config-zip \
                      --name "$(DEV_FUNCTION_APP)" \
                      --resource-group "$(DEV_RESOURCE_GROUP)" \
                      --src "$FUNCTION_ZIP"

                    echo "DEV Function deployment completed."


# ============================================================
# DEV VERIFY
# ============================================================

- stage: DevVerify
  displayName: Validate DEV Deployment

  dependsOn: DevDeploy
  condition: succeeded()

  jobs:

    - job: VerifyDev
      displayName: Verify DEV resources

      steps:

        - task: AzureCLI@2
          displayName: Validate DEV Azure resources

          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript

            inlineScript: |
              set -euo pipefail

              echo "=========================================="
              echo "Validating DEV Resource Groups"
              echo "=========================================="

              az group show \
                --name "$(DEV_RESOURCE_GROUP)" \
                --query "{Name:name,Location:location}" \
                -o table

              az group show \
                --name rg-eipp-dev-obs-cus \
                --query "{Name:name,Location:location}" \
                -o table

              echo "=========================================="
              echo "Validating DEV Storage Account"
              echo "=========================================="

              az storage account show \
                --name steippdevdata2978a89b \
                --resource-group "$(DEV_RESOURCE_GROUP)" \
                --query "{
                  Name:name,
                  Location:location,
                  HTTPS:enableHttpsTrafficOnly,
                  TLS:minimumTlsVersion,
                  PublicAccess:allowBlobPublicAccess
                }" \
                -o table

              echo "=========================================="
              echo "Validating DEV Function App"
              echo "=========================================="

              az functionapp show \
                --name "$(DEV_FUNCTION_APP)" \
                --resource-group "$(DEV_RESOURCE_GROUP)" \
                --query "{
                  Name:name,
                  State:state,
                  HTTPSOnly:httpsOnly,
                  Hostname:defaultHostName
                }" \
                -o table

              DEV_FUNCTION_STATE=$(az functionapp show \
                --name "$(DEV_FUNCTION_APP)" \
                --resource-group "$(DEV_RESOURCE_GROUP)" \
                --query state \
                -o tsv)

              if [ "$DEV_FUNCTION_STATE" != "Running" ]; then
                echo "ERROR: DEV Function App is not running."
                exit 1
              fi

              echo "DEV deployment validation successful."


# ============================================================
# PROD PLAN
# ============================================================

- stage: ProdPlan
  displayName: PROD Terraform Plan

  dependsOn: DevVerify
  condition: succeeded()

  jobs:

    - job: TerraformProdPlan
      displayName: Plan PROD infrastructure

      steps:

        - checkout: self
          clean: true

        - bash: |
            set -euo pipefail

            sudo apt-get update -qq
            sudo apt-get install -y unzip

            curl -fsSLo terraform.zip \
              "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"

            unzip -q terraform.zip
            sudo install terraform /usr/local/bin/terraform
          displayName: Install Terraform

        - task: AzureCLI@2
          displayName: Terraform init and plan PROD using WIF

          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            addSpnToEnvironment: true

            inlineScript: |
              set -euo pipefail

              export ARM_USE_OIDC=true
              export ARM_USE_AZUREAD=true
              export ARM_CLIENT_ID="$servicePrincipalId"
              export ARM_TENANT_ID="$tenantId"
              export ARM_OIDC_TOKEN="$idToken"
              export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

              PROD_PATH="$(Build.SourcesDirectory)/$(PROD_ROOT)"

              terraform -chdir="$PROD_PATH" init \
                -reconfigure \
                -input=false \
                -backend-config=backend.hcl

              terraform -chdir="$PROD_PATH" plan \
                -input=false \
                -out="$(PROD_PLAN)"

              terraform -chdir="$PROD_PATH" show \
                -no-color \
                "$(PROD_PLAN)" \
                > "$(Build.ArtifactStagingDirectory)/eipp-prod-plan.txt"

              cp \
                "$PROD_PATH/$(PROD_PLAN)" \
                "$(Build.ArtifactStagingDirectory)/$(PROD_PLAN)"

        - publish: $(Build.ArtifactStagingDirectory)
          artifact: prod-terraform-plan
          displayName: Publish PROD Terraform plan


# ============================================================
# PROD DEPLOY
# ============================================================

- stage: ProdDeploy
  displayName: Deploy PROD

  dependsOn: ProdPlan
  condition: succeeded()

  jobs:

    - deployment: ApplyProd
      displayName: Apply PROD Terraform and Function

      environment: eipp-prod

      strategy:
        runOnce:
          deploy:

            steps:

              - checkout: self
                clean: true

              - download: current
                artifact: prod-terraform-plan

              - download: current
                artifact: function-package

              - bash: |
                  set -euo pipefail

                  sudo apt-get update -qq
                  sudo apt-get install -y unzip

                  curl -fsSLo terraform.zip \
                    "https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip"

                  unzip -q terraform.zip
                  sudo install terraform /usr/local/bin/terraform
                displayName: Install Terraform

              - task: AzureCLI@2
                displayName: Terraform apply PROD

                inputs:
                  azureSubscription: $(AZURE_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true

                  inlineScript: |
                    set -euo pipefail

                    export ARM_USE_OIDC=true
                    export ARM_USE_AZUREAD=true
                    export ARM_CLIENT_ID="$servicePrincipalId"
                    export ARM_TENANT_ID="$tenantId"
                    export ARM_OIDC_TOKEN="$idToken"
                    export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                    PROD_PATH="$(Build.SourcesDirectory)/$(PROD_ROOT)"

                    terraform -chdir="$PROD_PATH" init \
                      -reconfigure \
                      -input=false \
                      -backend-config=backend.hcl

                    cp \
                      "$(Pipeline.Workspace)/prod-terraform-plan/$(PROD_PLAN)" \
                      "$PROD_PATH/$(PROD_PLAN)"

                    terraform -chdir="$PROD_PATH" apply \
                      -input=false \
                      -auto-approve \
                      "$(PROD_PLAN)"

              - task: AzureCLI@2
                displayName: Deploy Azure Function to PROD

                inputs:
                  azureSubscription: $(AZURE_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript

                  inlineScript: |
                    set -euo pipefail

                    FUNCTION_ZIP="$(Pipeline.Workspace)/function-package/$(FUNCTION_PACKAGE)"

                    test -f "$FUNCTION_ZIP"

                    az functionapp show \
                      --name "$(PROD_FUNCTION_APP)" \
                      --resource-group "$(PROD_RESOURCE_GROUP)" \
                      --query "{Name:name,State:state}" \
                      -o table

                    az functionapp deployment source config-zip \
                      --name "$(PROD_FUNCTION_APP)" \
                      --resource-group "$(PROD_RESOURCE_GROUP)" \
                      --src "$FUNCTION_ZIP"

                    echo "PROD Function deployment completed."


# ============================================================
# PROD VERIFY
# ============================================================

- stage: ProdVerify
  displayName: Validate PROD Deployment

  dependsOn: ProdDeploy
  condition: succeeded()

  jobs:

    - job: VerifyProd
      displayName: Verify PROD resources

      steps:

        - task: AzureCLI@2
          displayName: Validate PROD Azure resources

          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript

            inlineScript: |
              set -euo pipefail

              echo "=========================================="
              echo "Validating PROD Resource Groups"
              echo "=========================================="

              az group show \
                --name "$(PROD_RESOURCE_GROUP)" \
                --query "{Name:name,Location:location}" \
                -o table

              az group show \
                --name rg-eipp-prod-obs-cus \
                --query "{Name:name,Location:location}" \
                -o table

              echo "=========================================="
              echo "Validating PROD Storage Account"
              echo "=========================================="

              az storage account show \
                --name steippproddata2978a89b \
                --resource-group "$(PROD_RESOURCE_GROUP)" \
                --query "{
                  Name:name,
                  Location:location,
                  HTTPS:enableHttpsTrafficOnly,
                  TLS:minimumTlsVersion,
                  PublicAccess:allowBlobPublicAccess
                }" \
                -o table

              echo "=========================================="
              echo "Validating PROD Function App"
              echo "=========================================="

              az functionapp show \
                --name "$(PROD_FUNCTION_APP)" \
                --resource-group "$(PROD_RESOURCE_GROUP)" \
                --query "{
                  Name:name,
                  State:state,
                  HTTPSOnly:httpsOnly,
                  Hostname:defaultHostName
                }" \
                -o table

              PROD_FUNCTION_STATE=$(az functionapp show \
                --name "$(PROD_FUNCTION_APP)" \
                --resource-group "$(PROD_RESOURCE_GROUP)" \
                --query state \
                -o tsv)

              if [ "$PROD_FUNCTION_STATE" != "Running" ]; then
                echo "ERROR: PROD Function App is not running."
                exit 1
              fi

              echo "PROD deployment validation successful."
